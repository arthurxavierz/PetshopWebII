<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Pet</title>
</head>
<body>

    <h1 th:text="${pet.id != null ? 'Editar pet' : 'Cadastrar pet'}">Cadastrar pet</h1>

    <form th:action="${pet.id != null ? '/pet/atualizar/' + pet.id : '/pet/salvar'}" method="post" th:object="${pet}">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}">
        </div>

        <div>
            <label for="especie">Espécie:</label>
            <input type="text" id="especie" th:field="*{especie}">
        </div>

        <div>
            <label for="raca">Raça:</label>
            <input type="text" id="raca" th:field="*{raca}">
        </div>

        <div>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" th:field="*{idade}">
        </div>

        <div>
            <label for="tutor">Tutor:</label>
            <input type="text" id="tutor" th:field="*{tutor}">
        </div>

        <button type="submit">Salvar</button>
        <a href="/pet">Cancelar</a>
    </form>

</body>
</html>
