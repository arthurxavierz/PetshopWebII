<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Petshop</title>
</head>
<body>

    <h1>Pets cadastrados</h1>

    <a href="/pet/novo">Novo pet</a>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Espécie</th>
                <th>Raça</th>
                <th>Idade</th>
                <th>Tutor</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="pet : ${pets}">
                <td th:text="${pet.id}"></td>
                <td th:text="${pet.nome}"></td>
                <td th:text="${pet.especie}"></td>
                <td th:text="${pet.raca}"></td>
                <td th:text="${pet.idade}"></td>
                <td th:text="${pet.tutor}"></td>
                <td>
                    <a th:href="@{/pet/editar/{id}(id=${pet.id})}">Editar</a>
                    |
                    <a th:href="@{/pet/excluir/{id}(id=${pet.id})}" onclick="return confirm('Deseja realmente excluir este pet?')">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
