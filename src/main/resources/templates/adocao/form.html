<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <th:block th:replace="~{/../fragments/head :: head('Solicitar Adoção')}"></th:block>
  <body>
    <th:block th:replace="~{/../fragments/head :: header}"></th:block>

    <div class="container mt-4">
      <h1>Solicitar adoção</h1>

      <form th:action="@{/adocao/salvar}" th:object="${solicitacao}" method="post">
        <!-- Mensagens das regras de negócio (ex.: pet já adotado) -->
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
          <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}" class="mb-0"></p>
        </div>

        <div class="form-group row">
          <label for="pet" class="col-sm-2 col-form-label">Pet:</label>
          <div class="col-sm-10">
            <select class="form-control" id="pet" th:field="*{pet.id}">
              <option value="">Escolha o pet</option>
              <option th:each="p : ${pets}" th:value="${p.id}" th:text="${p.nome + ' (' + p.especie + ', ' + p.idade + ' anos)'}"></option>
            </select>
          </div>
        </div>

        <div class="form-group row">
          <label for="nomeAdotante" class="col-sm-2 col-form-label">Seu nome:</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="nomeAdotante" th:field="*{nomeAdotante}" placeholder="Digite o seu nome" />
            <p th:if="${#fields.hasErrors('nomeAdotante')}" th:errorclass="text-danger" th:errors="*{nomeAdotante}" />
          </div>
        </div>

        <div class="form-group row">
          <label for="telefone" class="col-sm-2 col-form-label">Telefone:</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="telefone" th:field="*{telefone}" placeholder="(34) 99999-9999" />
            <p th:if="${#fields.hasErrors('telefone')}" th:errorclass="text-danger" th:errors="*{telefone}" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Enviar solicitação</button>
        <a th:href="@{/adocao}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>

    <th:block th:replace="~{/../fragments/footer :: footer}"></th:block>
  </body>
</html>
